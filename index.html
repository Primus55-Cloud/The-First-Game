from IPython.display import HTML

html_content = """
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Blok Kirma Oyunu</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        /* Oyun Alanımızın Çerçevesi */
        canvas {
            background-color: #000;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
    </style>
</head>
<body>

    <!-- Oyun Tuvali (600x400 piksel) -->
    <canvas id="oyunAlani" width="600" height="400"></canvas>

<script>
    // 1. Tuval ve Çizim Kalemini Alıyoruz
    const canvas = document.getElementById("oyunAlani");
    const ctx = canvas.getContext("2d");

    // 2. Palet (Raket) Değişkenleri
    const paletYukseklik = 12;
    const paletGenislik = 90;
    let paletX = (canvas.width - paletGenislik) / 2; // Başlangıçta tam ortada dursun
    const paletHizi = 7; // Sağa sola kaç piksel kaysın?

    // Top Değişkenleri
    const topYaricap = 10;
    let topX = canvas.width / 2; // Başlangıçta tuvalin ortasında
    let topY = canvas.height - 30; // Paletin biraz üzerinde
    let dx = 3; // Topun X eksenindeki hızı (her karede kaç piksel kaysın)
    let dy = -3; // Topun Y eksenindeki hızı (her karede kaç piksel kaysın)

    // Blok Değişkenleri
    const satirSayisi = 5;
    const sutunSayisi = 8;
    const blokGenislik = 60;
    const blokYukseklik = 20;
    const blokDolgu = 10;
    const blokUstBosluk = 30;
    const blokSolBosluk = 30;

    // Blokları tutacak 2 boyutlu dizi
    const bloklar = [];
    for (let c = 0; c < sutunSayisi; c++) {
        bloklar[c] = [];
        for (let r = 0; r < satirSayisi; r++) {
            bloklar[c][r] = { x: 0, y: 0, status: 1 }; // status: 1 (canlı), 0 (kırık)
        }
    }

    // Skor
    let skor = 0;

    // Tuş Basılma Durumları
    let sagTus = false;
    let solTus = false;

    // 3. Klavye Dinleyicileri (Tuşa basıldı mı, bırakıldı mı?)
    document.addEventListener("keydown", tusBasildi);
    document.addEventListener("keyup", tusBrakildi);

    function tusBasildi(e) {
        if (e.key === "Right" || e.key === "ArrowRight") sagTus = true;
        if (e.key === "Left" || e.key === "ArrowLeft") solTus = true;
    }

    function tusBrakildi(e) {
        if (e.key === "Right" || e.key === "ArrowRight") sagTus = false;
        if (e.key === "Left" || e.key === "ArrowLeft") solTus = false;
    }

    // 4. Paleti Çizen Fonksiyon
    function paletCiz() {
        ctx.beginPath();
        // rect(X_koordinatı, Y_koordinatı, Genişlik, Yükseklik)
        ctx.rect(paletX, canvas.height - paletYukseklik - 10, paletGenislik, paletYukseklik);
        ctx.fillStyle = "#00ffcc"; // Paletin rengi
        ctx.fill();
        ctx.closePath();
    }

    // 5. Topu Çizen Fonksiyon
    function topCiz() {
        ctx.beginPath();
        // arc(X_merkezi, Y_merkezi, Yarıçap, Başlangıç_açısı, Bitiş_açısı)
        ctx.arc(topX, topY, topYaricap, 0, Math.PI * 2);
        ctx.fillStyle = "#f0f0f0"; // Topun rengi
        ctx.fill();
        ctx.closePath();
    }

    // 6. Blokları Çizen Fonksiyon
    function bloklariCiz() {
        for (let c = 0; c < sutunSayisi; c++) {
            for (let r = 0; r < satirSayisi; r++) {
                if (bloklar[c][r].status === 1) { // Blok sağlamsa çiz
                    const blokX = c * (blokGenislik + blokDolgu) + blokSolBosluk;
                    const blokY = r * (blokYukseklik + blokDolgu) + blokUstBosluk;
                    bloklar[c][r].x = blokX;
                    bloklar[c][r].y = blokY;
                    ctx.beginPath();
                    ctx.rect(blokX, blokY, blokGenislik, blokYukseklik);
                    ctx.fillStyle = "#ff9933"; // Blok rengi
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    // 7. Çarpışma Algılama Fonksiyonu (Top-Blok)
    function carpismaAlgilama() {
        for (let c = 0; c < sutunSayisi; c++) {
            for (let r = 0; r < satirSayisi; r++) {
                const b = bloklar[c][r];
                if (b.status === 1) { // Eğer blok sağlamsa çarpışmayı kontrol et
                    if (
                        topX > b.x &&
                        topX < b.x + blokGenislik &&
                        topY > b.y &&
                        topY < b.y + blokYukseklik
                    ) {
                        dy = -dy; // Topun yönünü değiştir
                        b.status = 0; // Bloğu kırık olarak işaretle
                        skor++;
                        if (skor === satirSayisi * sutunSayisi) {
                            alert("TEBRİKLER, KAZANDINIZ!");
                            document.location.reload();
                        }
                    }
                }
            }
        }
    }

    // 8. Skoru Çizen Fonksiyon
    function skorCiz() {
        ctx.font = "16px Arial";
        ctx.fillStyle = "#f0f0f0";
        ctx.fillText("Skor: " + skor, 8, 20);
    }

    // 9. OYUN DÖNGÜSÜ (Game Loop)
    function oyunDongusu() {
        // Ekranı her karede temizle ki arkasında iz bırakmasın
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Paleti Çiz
        paletCiz();

        // Topu Çiz
        topCiz();

        // Blokları Çiz
        bloklariCiz();

        // Skoru Çiz
        skorCiz();

        // Topun Duvarlarla Çarpışması
        if (topX + dx > canvas.width - topYaricap || topX + dx < topYaricap) {
            dx = -dx; // X ekseninde yön değiştir
        }
        if (topY + dy < topYaricap) {
            dy = -dy; // Y ekseninde (üst duvarda) yön değiştir
        } else if (topY + dy > canvas.height - topYaricap) {
            // Top alta çarptı - Oyun Bitti!
            if (topX > paletX && topX < paletX + paletGenislik) {
                // Palete çarptı
                dy = -dy; // Y ekseninde yön değiştir
            } else {
                // Paleti kaçırdı
                alert("OYUN BİTTİ!");
                document.location.reload(); // Sayfayı yenileyerek oyunu baştan başlat
            }
        }

        // Klavye Kontrollerine Göre Paleti Hareket Ettir (Sınırlara Dikkatederek)
        if (sagTus && paletX < canvas.width - paletGenislik) {
            paletX += paletHizi;
        } else if (solTus && paletX > 0) {
            paletX -= paletHizi;
        }

        // Topun konumunu güncelle
        topX += dx;
        topY += dy;

        // Çarpışma Algılama (Top-Blok)
        carpismaAlgilama();

        // Saniyede 60 kare hızında bu fonksiyonu tekrar çalıştır
        requestAnimationFrame(oyunDongusu);
    }

    // Oyunu Başlat
    oyunDongusu();
</script>
</body>
</html>
"""
display(HTML(html_content))
